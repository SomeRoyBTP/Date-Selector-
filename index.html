<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date Proposal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: linear-gradient(135deg, #f5f1ff 0%, #fff0f8 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            max-width: 600px;
            width: 100%;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        /* ===== PAGE 1 STYLES ===== */
        .page-1 {
            display: flex;
            flex-direction: column;
        }

        .hero {
            position: relative;
            height: 300px;
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            text-align: center;
            padding: 40px 20px 60px;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.25);
            z-index: 1;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            color: white;
        }

        .hero h1 {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 12px;
            line-height: 1.2;
        }

        .hero p {
            font-size: 15px;
            opacity: 0.95;
            line-height: 1.4;
        }

        .button-group-hero {
            position: relative;
            z-index: 2;
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
        }

        .btn-yes {
            background: linear-gradient(135deg, #c084fc 0%, #e879f9 100%);
            color: white;
            border: none;
            padding: 14px 40px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(192, 132, 252, 0.3);
            transition: all 0.3s ease;
        }

        .btn-yes:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(192, 132, 252, 0.4);
        }

        .btn-yes:active {
            transform: translateY(0);
        }

        .btn-no {
            background: #f0f0f0;
            color: #333;
            border: none;
            padding: 14px 40px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .btn-no:hover {
            transform: translate(var(--tx, 0), var(--ty, 0));
        }

        /* ===== PAGE 2 STYLES ===== */
        .page-2 {
            padding: 40px 30px;
        }

        .section {
            margin-bottom: 35px;
        }

        .section:last-of-type {
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.7;
        }

        .date-time-picker {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-size: 13px;
            font-weight: 500;
            color: #666;
            margin-bottom: 6px;
        }

        .input-group input {
            padding: 12px;
            border: 2px solid #e0d5ff;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: #c084fc;
            box-shadow: 0 0 0 3px rgba(192, 132, 252, 0.1);
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .option-card {
            position: relative;
        }

        .option-card input[type="radio"] {
            position: absolute;
            opacity: 0;
            cursor: pointer;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        .option-label {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px 12px;
            background: #f8f6ff;
            border: 2px solid #e0d5ff;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: #555;
            transition: all 0.3s ease;
            text-align: center;
            min-height: 60px;
            user-select: none;
        }

        .option-card input[type="radio"]:checked + .option-label {
            background: linear-gradient(135deg, #c084fc 0%, #e879f9 100%);
            color: white;
            border-color: #b06fd9;
            box-shadow: 0 4px 15px rgba(192, 132, 252, 0.3);
            transform: scale(1.05);
        }

        .option-label:hover {
            border-color: #c084fc;
            background: #faf8ff;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 35px;
        }

        .btn {
            flex: 1;
            padding: 14px 24px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .btn-primary {
            background: linear-gradient(135deg, #c084fc 0%, #e879f9 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(192, 132, 252, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(192, 132, 252, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .footer-note {
            text-align: center;
            font-size: 13px;
            color: #999;
            padding: 0 30px 30px;
            line-height: 1.5;
            font-style: italic;
        }

        .success-message {
            display: none;
            text-align: center;
            color: #10b981;
            font-weight: 500;
            margin-top: 15px;
            padding: 10px;
            background: #ecfdf5;
            border-radius: 8px;
        }

        @media (max-width: 480px) {
            .hero {
                height: 250px;
                padding: 30px 20px 50px;
            }

            .hero h1 {
                font-size: 28px;
            }

            .button-group-hero {
                gap: 12px;
            }

            .btn-yes,
            .btn-no {
                padding: 12px 30px;
                font-size: 14px;
            }

            .page-2 {
                padding: 30px 20px;
            }

            .date-time-picker {
                grid-template-columns: 1fr;
            }

            .options-grid {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .option-label {
                min-height: 50px;
                padding: 12px 10px;
                font-size: 13px;
            }

            .button-group {
                gap: 10px;
            }

            .btn {
                padding: 12px 20px;
                font-size: 14px;
            }

            .footer-note {
                padding: 0 20px 20px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- PAGE 1: YES or NO -->
        <div class="page page-1 active">
            <div id="hero" class="hero"></div>
            <div class="button-group-hero">
                <button id="btnYes" class="btn-yes">Yes 💕</button>
                <button id="btnNo" class="btn-no">No</button>
            </div>
        </div>

        <!-- PAGE 2: DATE, TIME, and ACTIVITY PICKER -->
        <div class="page page-2">
            <form id="dateForm">
                <!-- Date & Time Section -->
                <div class="section">
                    <div class="section-title">When?</div>
                    <div class="date-time-picker">
                        <div class="input-group">
                            <label for="dateInput">Date</label>
                            <input type="date" id="dateInput" name="date" required>
                        </div>
                        <div class="input-group">
                            <label for="timeInput">Time</label>
                            <input type="time" id="timeInput" name="time" required>
                        </div>
                    </div>
                </div>

                <!-- Activity Section -->
                <div class="section">
                    <div class="section-title">Activity</div>
                    <div id="activitySection" class="options-grid"></div>
                </div>

                <!-- Buttons -->
                <div class="button-group">
                    <button type="submit" class="btn btn-primary">Send me your picks 💕</button>
                    <button type="reset" class="btn btn-secondary">Clear</button>
                </div>
                <div class="success-message" id="successMessage">
                    ✓ Sent! Waiting for your response...
                </div>
            </form>
        </div>

        <div class="footer-note" id="footerNote"></div>
    </div>

    <script>
        // ========================================
        // EDIT HERE: Configuration Object
        // ========================================
        const CONFIG = {
            // Header section
            headerTitle: "Will you go on a date with me?",
            headerSubtitle: "I promise to make it fun! 🎉",
            headerImage: "https://images.unsplash.com/photo-1516595183901-7a86d65ce338?w=600&h=300&fit=crop",
            
            // Activity options - EDIT HERE
            activities: [
                { label: "☕ Coffee", value: "coffee" },
                { label: "🚶 Walk", value: "walk" },
                { label: "🎬 Movie", value: "movie" },
                { label: "🍽️ Dinner", value: "dinner" }
            ],
            
            // WhatsApp phone number (without + sign, just country code + number) - EDIT HERE
            whatsappNumber: "919876543210",
            
            // Footer note - EDIT HERE
            footerNote: "No pressure at all. Just pick whatever feels right. 💚"
        };
        // ========================================
        // End of CONFIG - Do not edit below unless you know what you're doing!
        // ========================================

        // Initialize the page on load
        document.addEventListener('DOMContentLoaded', function() {
            renderPage1();
            renderPage2();
            setupEventListeners();
        });

        // Render Page 1: Hero with Yes/No buttons
        function renderPage1() {
            const heroEl = document.getElementById('hero');
            heroEl.style.backgroundImage = `url('${CONFIG.headerImage}')`;
            
            const heroContent = document.createElement('div');
            heroContent.className = 'hero-content';
            heroContent.innerHTML = `
                <h1>${CONFIG.headerTitle}</h1>
                <p>${CONFIG.headerSubtitle}</p>
            `;
            heroEl.appendChild(heroContent);
        }

        // Render Page 2: Date/Time picker and Activity section
        function renderPage2() {
            const activitySection = document.getElementById('activitySection');
            
            CONFIG.activities.forEach((activity, index) => {
                const card = document.createElement('div');
                card.className = 'option-card';
                
                const radio = document.createElement('input');
                radio.type = 'radio';
                radio.name = 'activity';
                radio.value = activity.value;
                radio.id = `activity_${index}`;
                radio.required = true;
                
                const label = document.createElement('label');
                label.htmlFor = `activity_${index}`;
                label.className = 'option-label';
                label.textContent = activity.label;
                
                card.appendChild(radio);
                card.appendChild(label);
                activitySection.appendChild(card);
            });

            // Set footer note
            document.getElementById('footerNote').textContent = CONFIG.footerNote;
        }

        // Setup event listeners
        function setupEventListeners() {
            const btnYes = document.getElementById('btnYes');
            const btnNo = document.getElementById('btnNo');
            const page1 = document.querySelector('.page-1');
            const page2 = document.querySelector('.page-2');

            // Yes button: Go to page 2
            btnYes.addEventListener('click', function() {
                page1.classList.remove('active');
                page2.classList.add('active');
            });

            // No button: Move away when hovered/clicked
            btnNo.addEventListener('mouseenter', function() {
                moveButtonAway(btnNo);
            });

            btnNo.addEventListener('click', function(e) {
                e.preventDefault();
                moveButtonAway(btnNo);
            });

            // Form submission on page 2
            document.getElementById('dateForm').addEventListener('submit', handleFormSubmission);
        }

        // Move the No button to a random position
        function moveButtonAway(button) {
            const maxX = window.innerWidth - button.offsetWidth - 20;
            const maxY = window.innerHeight - button.offsetHeight - 20;
            
            const randomX = Math.random() * maxX;
            const randomY = Math.random() * maxY;
            
            button.style.position = 'fixed';
            button.style.left = randomX + 'px';
            button.style.top = randomY + 'px';
            button.style.transition = 'all 0.3s ease';
        }

        // Handle form submission on page 2
        function handleFormSubmission(e) {
            e.preventDefault();
            
            // Get selected values
            const dateInput = document.getElementById('dateInput').value;
            const timeInput = document.getElementById('timeInput').value;
            const activity = document.querySelector('input[name="activity"]:checked');
            
            // Validate all fields are filled
            if (!dateInput || !timeInput || !activity) {
                alert('Please fill in all fields!');
                return;
            }
            
            // Get activity label
            const activityLabel = document.querySelector(`label[for="${activity.id}"]`).textContent;
            
            // Format date nicely
            const dateObj = new Date(dateInput);
            const formattedDate = dateObj.toLocaleDateString('en-US', { 
                weekday: 'short', 
                month: 'short', 
                day: 'numeric',
                year: 'numeric'
            });
            
            // Build the message
            const message = `Hi! I'd love to go on a date! 💕\n\nHere are my picks:\n📅 Date: ${formattedDate}\n⏰ Time: ${timeInput}\n🎯 Activity: ${activityLabel}`;
            
            // Encode the message for URL
            const encodedMessage = encodeURIComponent(message);
            
            // Build WhatsApp URL
            const whatsappURL = `https://wa.me/${CONFIG.whatsappNumber}?text=${encodedMessage}`;
            
            // Open WhatsApp
            window.open(whatsappURL, '_blank');
            
            // Show success message
            const successMsg = document.getElementById('successMessage');
            successMsg.style.display = 'block';
            
            // Hide success message after 3 seconds
            setTimeout(() => {
                successMsg.style.display = 'none';
            }, 3000);
        }
    </script>
</body>
</html>
