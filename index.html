<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date Proposal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: linear-gradient(135deg, #f5f1ff 0%, #fff0f8 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            max-width: 600px;
            width: 100%;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        /* ===== PAGE 1 STYLES ===== */
        .page-1 {
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .hero {
            position: relative;
            height: 300px;
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            text-align: center;
            padding: 40px 20px 60px;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.25);
            z-index: 1;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            color: white;
        }

        .hero h1 {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 12px;
            line-height: 1.2;
        }

        .hero p {
            font-size: 15px;
            opacity: 0.95;
            line-height: 1.4;
        }

        .button-group-hero {
            position: relative;
            z-index: 2;
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            padding: 0 20px 30px;
        }

        .btn-yes {
            background: linear-gradient(135deg, #c084fc 0%, #e879f9 100%);
            color: white;
            border: none;
            padding: 14px 40px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(192, 132, 252, 0.3);
            transition: all 0.3s ease;
            z-index: 10;
        }

        .btn-yes:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(192, 132, 252, 0.4);
        }

        .btn-yes:active {
            transform: translateY(0);
        }

        .btn-no-container {
            position: relative;
            height: 50px;
            width: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-no {
            background: #f0f0f0;
            color: #333;
            border: none;
            padding: 14px 40px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: absolute;
            z-index: 5;
        }

        .btn-no:hover {
            opacity: 0;
            transform: scale(0.8);
        }

        .no-text {
            position: absolute;
            opacity: 0;
            font-size: 13px;
            font-weight: 600;
            color: #c084fc;
            text-align: center;
            padding: 5px;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 6;
            line-height: 1.3;
        }

        .btn-no-container:hover .no-text {
            opacity: 1;
        }

        /* ===== PAGE 2 STYLES ===== */
        .page-2 {
            padding: 40px 30px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section:last-of-type {
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.7;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        .option-card {
            position: relative;
        }

        .option-card input[type="radio"] {
            position: absolute;
            opacity: 0;
            cursor: pointer;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        .option-label {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 20px;
            background: #f8f6ff;
            border: 2px solid #e0d5ff;
            border-radius: 14px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            color: #555;
            transition: all 0.3s ease;
            text-align: center;
            min-height: 80px;
            user-select: none;
            line-height: 1.4;
        }

        .option-card input[type="radio"]:checked + .option-label {
            background: linear-gradient(135deg, #c084fc 0%, #e879f9 100%);
            color: white;
            border-color: #b06fd9;
            box-shadow: 0 6px 20px rgba(192, 132, 252, 0.35);
            transform: scale(1.02);
        }

        .option-label:hover {
            border-color: #c084fc;
            background: #faf8ff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(192, 132, 252, 0.15);
        }

        .option-card input[type="radio"]:checked + .option-label:hover {
            transform: scale(1.02);
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 40px;
        }

        .btn {
            flex: 1;
            padding: 14px 24px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .btn-primary {
            background: linear-gradient(135deg, #c084fc 0%, #e879f9 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(192, 132, 252, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(192, 132, 252, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .footer-note {
            text-align: center;
            font-size: 13px;
            color: #999;
            padding: 0 30px 30px;
            line-height: 1.5;
            font-style: italic;
        }

        .success-message {
            display: none;
            text-align: center;
            color: #10b981;
            font-weight: 500;
            margin-top: 15px;
            padding: 10px;
            background: #ecfdf5;
            border-radius: 8px;
        }

        @media (max-width: 480px) {
            .hero {
                height: 250px;
                padding: 30px 20px 50px;
            }

            .hero h1 {
                font-size: 28px;
            }

            .button-group-hero {
                gap: 12px;
                padding: 0 10px 20px;
            }

            .btn-yes,
            .btn-no {
                padding: 12px 30px;
                font-size: 14px;
            }

            .no-text {
                font-size: 11px;
            }

            .page-2 {
                padding: 30px 20px;
            }

            .section {
                margin-bottom: 30px;
            }

            .options-grid {
                gap: 12px;
            }

            .option-label {
                padding: 18px 16px;
                min-height: 70px;
                font-size: 14px;
            }

            .button-group {
                gap: 10px;
                margin-top: 30px;
            }

            .btn {
                padding: 12px 20px;
                font-size: 14px;
            }

            .footer-note {
                padding: 0 20px 20px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- PAGE 1: YES or NO -->
        <div class="page page-1 active">
            <div id="hero" class="hero"></div>
            <div class="button-group-hero">
                <button id="btnYes" class="btn-yes">Yes 💕</button>
                <div class="btn-no-container">
                    <button id="btnNo" class="btn-no">No</button>
                    <div class="no-text">We are not accepting<br>No as an Answer 😊</div>
                </div>
            </div>
        </div>

        <!-- PAGE 2: DATE and ACTIVITY PICKER -->
        <div class="page page-2">
            <form id="dateForm">
                <!-- Date Section -->
                <div class="section">
                    <div class="section-title">When?</div>
                    <div id="dateSection" class="options-grid"></div>
                </div>

                <!-- Activity Section -->
                <div class="section">
                    <div class="section-title">Activity</div>
                    <div id="activitySection" class="options-grid"></div>
                </div>

                <!-- Buttons -->
                <div class="button-group">
                    <button type="submit" class="btn btn-primary">Send me your picks 💕</button>
                    <button type="reset" class="btn btn-secondary">Clear</button>
                </div>
                <div class="success-message" id="successMessage">
                    ✓ Sent! Waiting for your response...
                </div>
            </form>
        </div>

        <div class="footer-note" id="footerNote"></div>
    </div>

    <script>
        // ========================================
        // EDIT HERE: Configuration Object
        // ========================================
        const CONFIG = {
            // Header section
            headerTitle: "Will you go on a date with us?",
            headerSubtitle: "I know I fucked up but I promise to make it up! 🎉",
            headerImage: "https://raw.githubusercontent.com/SomeRoyBTP/Peace-Offering/main/background.jpg",
            
            // Date options - EDIT HERE
            dateOptions: [
                { label: "Friday 2nd Oct\nAfternoon", value: "fri_2_oct" },
                { label: "Saturday 3rd Oct\nAfternoon", value: "sat_3_oct" },
                { label: "Sunday 4th Oct\nAfternoon", value: "sun_4_oct" }
            ],
            
            // Activity options - EDIT HERE
            activities: [
                { label: "🎬 Movie Date\n(Endgame/Heart of the Beast)", value: "movie_date" },
                { label: "🐶 Pup Date\n(Meeting & Eating with Puchi)", value: "pup_date" },
                { label: "🎬🐶 Movie and the Pup Date", value: "movie_pup_date" }
            ],
            
            // WhatsApp phone number (without + sign, just country code + number) - EDIT HERE
            whatsappNumber: "919832144112",
            
            // Footer note - EDIT HERE
            footerNote: "No pressure at all. Just pick whatever feels right. 💚"
        };
        // ========================================
        // End of CONFIG - Do not edit below unless you know what you're doing!
        // ========================================

        // Initialize the page on load
        document.addEventListener('DOMContentLoaded', function() {
            renderPage1();
            renderPage2();
            setupEventListeners();
        });

        // Render Page 1: Hero with Yes/No buttons
        function renderPage1() {
            const heroEl = document.getElementById('hero');
            heroEl.style.backgroundImage = `url('${CONFIG.headerImage}')`;
            
            const heroContent = document.createElement('div');
            heroContent.className = 'hero-content';
            heroContent.innerHTML = `
                <h1>${CONFIG.headerTitle}</h1>
                <p>${CONFIG.headerSubtitle}</p>
            `;
            heroEl.appendChild(heroContent);
        }

        // Render Page 2: Date and Activity sections
        function renderPage2() {
            renderDateOptions();
            renderActivityOptions();

            // Set footer note
            document.getElementById('footerNote').textContent = CONFIG.footerNote;
        }

        // Render date options
        function renderDateOptions() {
            const dateSection = document.getElementById('dateSection');
            
            CONFIG.dateOptions.forEach((dateOption, index) => {
                const card = document.createElement('div');
                card.className = 'option-card';
                
                const radio = document.createElement('input');
                radio.type = 'radio';
                radio.name = 'date';
                radio.value = dateOption.value;
                radio.id = `date_${index}`;
                radio.required = true;
                
                const label = document.createElement('label');
                label.htmlFor = `date_${index}`;
                label.className = 'option-label';
                label.innerHTML = dateOption.label;
                
                card.appendChild(radio);
                card.appendChild(label);
                dateSection.appendChild(card);
            });
        }

        // Render activity options
        function renderActivityOptions() {
            const activitySection = document.getElementById('activitySection');
            
            CONFIG.activities.forEach((activity, index) => {
                const card = document.createElement('div');
                card.className = 'option-card';
                
                const radio = document.createElement('input');
                radio.type = 'radio';
                radio.name = 'activity';
                radio.value = activity.value;
                radio.id = `activity_${index}`;
                radio.required = true;
                
                const label = document.createElement('label');
                label.htmlFor = `activity_${index}`;
                label.className = 'option-label';
                label.innerHTML = activity.label;
                
                card.appendChild(radio);
                card.appendChild(label);
                activitySection.appendChild(card);
            });
        }

        // Setup event listeners
        function setupEventListeners() {
            const btnYes = document.getElementById('btnYes');
            const btnNo = document.getElementById('btnNo');
            const page1 = document.querySelector('.page-1');
            const page2 = document.querySelector('.page-2');

            // Yes button: Go to page 2
            btnYes.addEventListener('click', function() {
                page1.classList.remove('active');
                page2.classList.add('active');
            });

            // No button: Prevent any action
            btnNo.addEventListener('click', function(e) {
                e.preventDefault();
            });

            // Form submission on page 2
            document.getElementById('dateForm').addEventListener('submit', handleFormSubmission);
        }

        // Handle form submission on page 2
        function handleFormSubmission(e) {
            e.preventDefault();
            
            // Get selected values
            const dateOption = document.querySelector('input[name="date"]:checked');
            const activity = document.querySelector('input[name="activity"]:checked');
            
            // Validate all fields are filled
            if (!dateOption || !activity) {
                alert('Please fill in all fields!');
                return;
            }
            
            // Get labels
            const dateLabel = document.querySelector(`label[for="${dateOption.id}"]`).textContent;
            const activityLabel = document.querySelector(`label[for="${activity.id}"]`).textContent;
            
            // Build the message
            const message = `Hi! I'd love to go on a date! 💕\n\nHere are my picks:\n📅 Date: ${dateLabel}\n🎯 Activity: ${activityLabel}`;
            
            // Encode the message for URL
            const encodedMessage = encodeURIComponent(message);
            
            // Build WhatsApp URL
            const whatsappURL = `https://wa.me/${CONFIG.whatsappNumber}?text=${encodedMessage}`;
            
            // Open WhatsApp
            window.open(whatsappURL, '_blank');
            
            // Show success message
            const successMsg = document.getElementById('successMessage');
            successMsg.style.display = 'block';
            
            // Hide success message after 3 seconds
            setTimeout(() => {
                successMsg.style.display = 'none';
            }, 3000);
        }
    </script>
</body>
</html>
